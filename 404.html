<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Aquí no hay pelos | Pelos.com</title>
  <meta name="description" content="Aquí no hay pelos. Pero sí te perdiste. Vuelve a la tienda oficial de Pelos.com.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121212'/%3E%3Cpath d='M8 24C12 24 10 16 16 16C22 16 20 8 24 8' stroke='%23C29B38' stroke-width='2.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: #121212;
      color: #FFFFFF;
    }
    .not-found-card {
      max-width: 580px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 40px 30px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }
    .not-found-img-frame {
      width: 220px;
      height: 220px;
      margin: 0 auto 24px auto;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid rgba(194, 155, 56, 0.3);
    }
    .not-found-img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .not-found-code {
      font-size: 0.82rem;
      letter-spacing: 0.2em;
      color: var(--accent-gold);
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .not-found-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    .not-found-desc {
      font-size: 1.1rem;
      color: #C5C2BA;
      margin-bottom: 30px;
    }
  </style>
</head>
<body class="not-found-page">
  <div class="not-found-card">
    <div class="not-found-img-frame">
      <img src="assets/images/editorial/404_empty_jar.jpg" alt="Frasco de espécimen vacío 404 Pelos.com">
    </div>
    <div class="not-found-code">ERROR 404 • ESPÉCIMEN NO ENCONTRADO</div>
    <h1 class="not-found-title">AQUÍ NO HAY PELOS.</h1>
    <p class="not-found-desc">Pero sí te perdiste.</p>
    <a href="index.html" class="btn-primary" style="padding: 16px 36px; font-size: 1rem;">
      VOLVER A LOS PELOS
    </a>
  </div>
</body>
</html>
